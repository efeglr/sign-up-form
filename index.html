<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="outer-box">
        <div id="left-div">
            <div id="logo-section">
                <img id="odin-logo" src="./assets/odin-logo-lined.png" alt="odin logo">
                <h1>ODIN</h3>
            </div>
        </div>
        <div id="right-div">
            <p>This is not a real online service! You know need something like this in your life to help you realize your deepest dreams.<br>Sign up now to get started.</p>
            <p>Something something again</p>
            <form action="/" method="get">
                <legend>Yo was geht</legend>
                <div id="full-form">
                    <div class ="side-form">
                        <label for="first-name">FIRST NAME</label>
                        <input id="first-name" type="text">
                        <label for="email">EMAIL</label>
                        <input id="email" type="email">                    
                        <label for="password">PASSWORD</label>
                        <input id="password" type="password">                    
                    </div>
                    <div class= "side-form">
                        <label for="last-name">LAST NAME</label>
                        <input id="last-name" type="text">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input id="phone-number" type="text">                    
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input id="confirm-password" type="password">                    
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
